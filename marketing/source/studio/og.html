<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><script src="brand.js"></script>
<style>
body{width:1200px;height:630px;overflow:hidden;position:relative}
.left{position:absolute;left:72px;top:64px;width:600px}
.brand{display:flex;align-items:center;gap:14px;font-size:30px}
h1{font-size:118px;margin-top:34px}
p.sub{font-size:27px;color:var(--muted);margin-top:26px;line-height:1.4;font-weight:500;max-width:520px}
.chips{display:flex;gap:12px;margin-top:30px}
.chips span{padding:12px 20px;font-size:21px}
.card{position:absolute;right:70px;top:58px;width:400px;transform:rotate(3deg);border-radius:40px;padding:12px;background:var(--orange);box-shadow:0 40px 70px -40px rgba(0,0,0,.6)}
.card .ph{position:relative;border-radius:30px;overflow:hidden}
.card img{display:block;width:100%;height:470px;object-fit:cover}
.ring{position:absolute;border:6px solid var(--yellow);border-radius:999px;box-shadow:0 0 30px 10px rgba(255,210,63,.45)}
.tag{position:absolute;left:18px;bottom:18px;background:#fff;border-radius:999px;padding:10px 18px 10px 12px;font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 16px -8px rgba(0,0,0,.5)}
.tag .ic{width:36px;height:36px;border-radius:999px;background:var(--yellow);display:grid;place-items:center}
</style></head><body class="paper">
<div class="left">
  <div class="brand display" id="brand"></div>
  <h1 class="display">Zoom in.<br>Find it.</h1>
  <p class="sub">Hide a shape in a real photo. Your friends zoom in to find it.</p>
  <div class="chips"><span class="chip">🎯 3 tries a day</span><span class="chip">💎 7-day hunt</span></div>
</div>
<div class="card"><div class="ph"><img src="img/p163.jpg"><div class="ring" style="left:calc(74% - 46px);top:calc(31% * 470 / 470 - 46px);width:92px;height:92px"></div>
<div class="tag"><span class="ic" id="ic"></span>Find the Star</div></div></div>
<div id="m" style="position:absolute;right:384px;bottom:-30px"></div>
<div id="s1" style="position:absolute;right:60px;top:30px"></div>
<script>
brand.innerHTML=BRAND.logoMark(54)+'<span>Zoom Hide</span>';
ic.innerHTML=BRAND.shape('star','#d7def0',22);
m.innerHTML=BRAND.mascot('cat','wow','var(--pink)',170);
s1.innerHTML=BRAND.sparkle(34,'#ffd23f');
</script></body></html>
